services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: supplychain
    ports:
      - "5432:5432"
    volumes:
      - supplychain-data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "
        until psql -h db -U postgres -d supplychain -c '\q' 2>/dev/null; do echo waiting for db; sleep 1; done;
        psql -h db -U postgres -d supplychain -f /app/sql/analytics_views.sql 2>/dev/null || true;
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/supplychain
    depends_on:
      - db

volumes:
  supplychain-data:
